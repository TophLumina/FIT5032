name: Week2345 build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'Week2345/tyang-library/**'
      - '.github/workflows/deploy-week2345.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Week2345/tyang-library/**'
      - '.github/workflows/deploy-week2345.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week2345-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: Week2345/tyang-library

jobs:
  build-and-deploy:
    name: Build and deploy Week2345
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: Week2345/tyang-library/.node-version
          cache: npm
          cache-dependency-path: Week2345/tyang-library/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Deploy production to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable in Settings > Secrets and variables > Actions > Variables.'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit access to the target account.'
            exit 1
          fi
          npx --no-install wrangler pages deploy dist --project-name tyang-library-week2345 --branch main
          echo 'Production site: https://tyang-library-week2345.pages.dev' >> "$GITHUB_STEP_SUMMARY"
